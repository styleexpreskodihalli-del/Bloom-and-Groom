<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom & Groom — Natural Care, Happy Pets</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-[#fdf6e9] text-[#2a4a3b]" style="font-family:'Plus Jakarta Sans'">
<nav class="sticky top-0 z-50 backdrop-blur-xl bg-[#fdf6e9]/85 border-b flex justify-between items-center px-6 md:px-10 py-4">
  <div style="font-family:'Cormorant Garamond'" class="text-[26px] font-bold">Bloom<br>& Groom</div>
  <div class="hidden md:flex gap-8 text-[11px] tracking-[0.25em] font-semibold"><a href="#shop">SHOP</a><a href="#story">STORY</a><a href="#ingredients">INGREDIENTS</a></div>
  <button onclick="toggleCart()" class="bg-[#2a4a3b] text-white px-5 py-2.5 rounded-full text-sm font-semibold">Cart (<span id="cartCount">0</span>)</button>
</nav>
<section class="max-w-[1440px] mx-auto px-4 md:px-6 mt-4">
  <div class="rounded-[32px] overflow-hidden bg-[#f3e9d1] flex flex-col md:flex-row min-h-[720px]">
    <div class="w-full md:w-[44%] p-8 md:p-14">
      <span class="border px-4 py-1.5 rounded-full text-[10px] tracking-[0.2em]">NATURAL • CRUELTY-FREE • VET-APPROVED</span>
      <h1 style="font-family:'Cormorant Garamond'" class="text-[62px] md:text-[82px] leading-[0.88] font-bold mt-6">Gentle care<br>for your<br>companions</h1>
      <p class="mt-6 opacity-75">Botanical grooming essentials for cats & dogs.</p>
      <div class="flex gap-3 mt-8"><button onclick="document.getElementById('shop').scrollIntoView()" class="bg-[#2a4a3b] text-white px-8 py-4 rounded-full text-sm">SHOP NOW</button><a href="https://wa.me/918197018680" target="_blank" class="bg-white px-8 py-4 rounded-full text-sm border">CHAT: +91 81970 18680</a></div>
    </div>
    <div class="w-full md:w-[56%] h-[540px] md:h-auto"><img src="hero.jpg" class="w-full h-full object-cover"></div>
  </div>
</section>
<section id="shop" class="max-w-[1440px] mx-auto px-6 md:px-10 py-16"><h2 style="font-family:'Cormorant Garamond'" class="text-5xl font-semibold mb-10">Shop the Ritual</h2><div id="productGrid" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div></section>
<div id="cartDrawer" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/40" onclick="toggleCart()"></div><div class="absolute right-0 top-0 h-full w-full max-w-[420px] bg-[#fdf6e9] flex flex-col"><div class="p-6 flex justify-between border-b"><h3 class="text-2xl font-semibold">Your Cart</h3><button onclick="toggleCart()">✕</button></div><div id="cartItems" class="flex-1 overflow-auto p-6 space-y-4"></div><div class="p-6 border-t bg-white"><div class="flex justify-between font-semibold mb-4"><span>Subtotal</span><span id="cartTotal">$0</span></div><button onclick="checkoutWhatsApp()" class="w-full bg-[#25D366] text-white py-4 rounded-full font-bold">Checkout on WhatsApp → +91 81970 18680</button></div></div></div>
<a href="https://wa.me/918197018680?text=Hi%20Bloom%20%26%20Groom!%20I%20want%20to%20shop%20🐾" target="_blank" class="fixed bottom-6 right-6 bg-[#25D366] text-white w-14 h-14 rounded-full grid place-items-center shadow-xl text-2xl z-40"><i class="fab fa-whatsapp"></i></a>
<script>
const products=[{id:1,name:"Paw Balm",price:12,desc:"25G",cat:"dog",img:"hero.jpg"},{id:2,name:"Shampoo",price:24,desc:"250ml",cat:"cat",img:"hero.jpg"},{id:3,name:"Conditioner",price:26,desc:"250ml",cat:"cat",img:"hero.jpg"},{id:4,name:"Hairball Paste",price:22,desc:"100ml",cat:"cat",img:"hero.jpg"},{id:5,name:"Detangling Spray",price:21,desc:"250ml",cat:"dog",img:"hero.jpg"},{id:6,name:"Ear Cleaner",price:18,desc:"100ml",cat:"dog",img:"hero.jpg"},{id:7,name:"Foam Shampoo",price:19,desc:"150ml",cat:"cat",img:"hero.jpg"},{id:8,name:"Complete Bundle",price:129,desc:"7 pieces",featured:true,img:"hero.jpg"}];
let cart=JSON.parse(localStorage.getItem('bloom_cart')||'[]');
function renderProducts(){const g=document.getElementById('productGrid');g.innerHTML='';products.forEach(p=>{const el=document.createElement('div');el.className=p.featured?"bg-[#2a4a3b] text-[#fdf6e9] rounded-[28px] p-7":"bg-white rounded-[24px] p-4";el.innerHTML=p.featured?`<h3 class="text-3xl">${p.name}</h3><p>${p.desc}</p><button onclick="addToCart(${p.id})" class="w-full bg-white text-[#2a4a3b] py-3 rounded-full mt-6 font-bold">ADD BUNDLE — $${p.price}</button>`:`<div class="bg-[#f9f0db] h-[200px] rounded-[18px] overflow-hidden"><img src="${p.img}" class="w-full h-full object-cover"></div><h3 class="font-semibold mt-3">${p.name} - $${p.price}</h3><button onclick="addToCart(${p.id})" class="w-full border py-2 rounded-full mt-2 text-xs">ADD TO CART</button>`;g.appendChild(el);});}
function addToCart(id){const item=products.find(p=>p.id===id);const f=cart.find(c=>c.id===id);if(f)f.qty++;else cart.push({...item,qty:1});localStorage.setItem('bloom_cart',JSON.stringify(cart));updateCartUI();document.getElementById('cartDrawer').classList.remove('hidden');}
function updateCartUI(){document.getElementById('cartCount').innerText=cart.reduce((s,c)=>s+c.qty,0);const d=document.getElementById('cartItems');d.innerHTML='';let t=0;cart.forEach(c=>{t+=c.price*c.qty;d.innerHTML+=`<div class="flex gap-3 bg-white p-3 rounded-xl"><img src="${c.img}" class="w-12 h-12 rounded"><div><b>${c.name}</b> x${c.qty} - $${c.price*c.qty}</div></div>`});document.getElementById('cartTotal').innerText='$'+t;}
function toggleCart(){document.getElementById('cartDrawer').classList.toggle('hidden');}
function checkoutWhatsApp(){if(!cart.length){alert('Cart empty');return;}let msg="Hi Bloom & Groom! 🐾%0AI want to order:%0A";cart.forEach(c=>{msg+=`• ${c.name} x${c.qty} = $${c.price*c.qty}%0A`;});msg+=`Total: $${cart.reduce((s,c)=>s+c.price*c.qty,0)}%0AName:%0AAddress:`;window.open(`https://wa.me/918197018680?text=${msg}`,'_blank');}
renderProducts();updateCartUI();
</script>
</body>
</html>
