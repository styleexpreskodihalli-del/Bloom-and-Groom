<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout - Bloom & Groom</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#fffaf5;}.serif{font-family:'Playfair Display',serif;}</style>
</head>
<body>
<nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0">
<div class="flex items-center gap-2"><img src="logo.jpg" style="height:50px;width:50px;border-radius:50%;mix-blend-mode:multiply;"><span class="serif font-bold">BLOOM & GROOM</span></div>
<a href="index-final-frozen.html" class="border px-4 py-2 rounded-full text-sm font-bold">← Shop</a>
</nav>
<div class="max-w-[1000px] mx-auto px-6 py-10 grid md:grid-cols-2 gap-8">
<div class="bg-white rounded-[24px] p-8 border">
<h2 class="serif text-xl font-bold mb-4">Delivery Details</h2>
<input id="cName" placeholder="Full Name *" class="w-full border rounded-xl px-4 py-3 mb-3">
<input id="cPhone" placeholder="Phone *" class="w-full border rounded-xl px-4 py-3 mb-3">
<textarea id="cAddress" placeholder="Address + Pincode *" class="w-full border rounded-xl px-4 py-3 mb-3 h-[80px]"></textarea>
<div id="summary" class="text-sm my-4 space-y-1"></div>
<div class="flex justify-between font-bold text-lg border-t pt-3"><span>Total</span><span id="total">₹0</span></div>
<button onclick="payNow()" class="w-full bg-black text-white py-4 rounded-full font-bold mt-6">Pay Now with Razorpay</button>
</div>
<div class="bg-black text-white rounded-[24px] p-8">
<h3 class="serif text-[#D4AF37] font-bold">Secure Payment</h3>
<p class="text-sm opacity-70 mt-4">Amount calculated on backend, cannot be tampered.</p>
</div>
</div>
<script>
let cart=JSON.parse(localStorage.getItem('bloom_cart')||'[]');let total=0;
function load(){let h='';total=0;cart.forEach(c=>{total+=c.price*c.qty*83;h+=`<div class="flex justify-between"><span>${c.name} x${c.qty}</span><span>₹${c.price*c.qty*83}</span></div>`});document.getElementById('summary').innerHTML=h||'Cart empty';document.getElementById('total').innerText='₹'+total;}load();
async function payNow(){
const name=document.getElementById('cName').value;const phone=document.getElementById('cPhone').value;const addr=document.getElementById('cAddress').value;
if(!name||!phone||!addr){alert('Fill Name, Phone, Address');return;}
const resp=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cart})});
const data=await resp.json();
if(!data.orderId){alert('Order creation failed');return;}
var options={ "key": data.key, "amount": data.amount, "currency": "INR", "name": "Bloom & Groom", "order_id": data.orderId, "image": "logo.jpg",
"handler": function(r){let m=`NEW PAID ORDER%0APayment ID: ${r.razorpay_payment_id}%0AOrder ID: ${data.orderId}%0AName: ${name}%0APhone: ${phone}%0AAddress: ${addr}%0AItems: ${cart.map(c=>c.name+' x'+c.qty).join(', ')}%0ATotal: ₹${total}`;localStorage.removeItem('bloom_cart');window.open(`https://wa.me/918197018680?text=${m}`,'_blank');},
"prefill": {"name": name, "contact": phone}, "theme": {"color": "#000000"}};
var rzp=new Razorpay(options);rzp.open();
}
</script>
</body>
</html>
